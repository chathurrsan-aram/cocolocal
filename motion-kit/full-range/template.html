<!doctype html><html><head><meta charset="utf-8"><title>Coco Local — Full Range</title><style>__FONTS__
html,body{margin:0;background:#F5F0E6;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
/* Coco Local — Full Range, 13 collections.  Code motion design: every frame is a pure function of time (seek).
   One persistent app: the real shopfront pushes in through the door, a cover folds into a 13-tile grid, a finger taps Slushies, the tile becomes the collection card,
   and the finger walks the tab bar through all thirteen.  Each collection lights its real shelves on an isometric map of
   the shop (built from the owner's floor plan, 3D cutaway and labelled CCTV / aisle photos), with a path from the door. */
const CFG=__CFG__, IMG={};
const BPM=120, B=60/BPM, W=1080, H=1920, c=document.getElementById('c'), x=c.getContext('2d');
const NAVY='#101039', CREAM='#F5F0E6', MUTED='#5E5B6B', BROWN='#8A5A2E', RULE='#DDD5C7', PILL='#FBDC8E';
const cl=v=>Math.min(1,Math.max(0,v)), lerp=(a,b,t)=>a+(b-a)*t;
const S=(e,w=14,z=1)=>{if(e<=0)return 0;if(z<1){const wd=w*Math.sqrt(1-z*z),ex=Math.exp(-z*w*e);return 1-ex*(Math.cos(wd*e)+(z*w/wd)*Math.sin(wd*e));}const ex=Math.exp(-w*e);return 1-ex*(1+w*e);};
const SP={ui:[16,.86],soft:[10,1],snap:[22,.8],lead:[26,.84],trail:[13,.92],pop:[24,.62]};
const s=(t,sp=SP.ui)=>S(t,sp[0],sp[1]);
// additive keyed track: keys [[beat,value],...] -> value at t with springs between keys
function trk(keys,t,sp=SP.ui){let v=keys[0][1];for(let i=1;i<keys.length;i++)v+=(keys[i][1]-keys[i-1][1])*s(t-keys[i][0]*B,sp);return v}
const eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}, eo3=t=>1-Math.pow(1-cl(t),3);
function txt(str,px,py,size,weight=600,color=NAVY,align='left',max=940,track=0){x.font=`${weight} ${size}px Poppins`;x.letterSpacing=track+'px';let m=x.measureText(str).width;if(m>max){size*=max/m;x.font=`${weight} ${size}px Poppins`;}x.fillStyle=color;x.textAlign=align;x.fillText(str,px,py);x.letterSpacing='0px';return size}
function tw(str,size,weight=600,track=0){x.font=`${weight} ${size}px Poppins`;x.letterSpacing=track+'px';const m=x.measureText(str).width;x.letterSpacing='0px';return m}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function masked(y0,h,fn){x.save();x.beginPath();x.rect(0,y0,W,h);x.clip();fn();x.restore()}
function cover(im,dx,dy,dw,dh){const r=Math.max(dw/im.width,dh/im.height),sw=dw/r,sh=dh/r;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,dx,dy,dw,dh)}

/* ---------------- data ---------------- */
const COL=CFG.collections, N=COL.length;
const T0=8, SEC=6, FIN=T0+SEC*N, END=FIN+8, TOTAL=END+6;   // beats (after the opener): cover 0–8 · 13×6 · finale · outro
const INTRO=4;                                              // the shopfront opener runs before beat 0
const sec=b=>Math.max(-1,Math.min(N-1,Math.floor((b-T0)/SEC)));

/* ---------------- the shop, in plan units (from the owner's customer-area layout) ---------------- */
const topY=xx=>145+(xx-90)*76/1070;           // the top wall slopes down towards the back
const FIX={
 tables:{x0:94,y0:153,x1:210,y1:212,h:44,col:'#E8D3BE'}, chill:{x0:212,y0:166,x1:660,y1:226,h:118,col:'#D6E6EA',glass:1},
 A:{x0:269,y0:317,x1:428,y1:362,h:44}, B:{x0:269,y0:422,x1:428,y1:467,h:44}, C:{x0:490,y0:311,x1:740,y1:368,h:96}, D:{x0:490,y0:415,x1:740,y1:472,h:96},
 E:{x0:800,y0:360,x1:1007,y1:430,h:96}, W:{x0:752,y0:252,x1:1040,y1:272,h:100},
 counter:{x0:110,y0:508,x1:428,y1:552,h:50,col:'#E8D3BE'}, spirits:{x0:110,y0:582,x1:428,y1:604,h:118,col:'#E2D9CC'},
 wine:{x0:435,y0:553,x1:575,y1:604,h:110,col:'#E6DCE8'}, beer:{x0:580,y0:553,x1:900,y1:604,h:118,col:'#D6E6EA',glass:1}, frozen:{x0:900,y0:553,x1:1048,y1:604,h:84,col:'#DCE4F2',glass:1},
 stair:{x0:745,y0:200,x1:1048,y1:250,h:24,col:'#E4E1DA',flat:1}};
const ORDER=Object.keys(FIX).sort((a,b)=>((FIX[a].y0+FIX[a].y1)*.65-(FIX[a].x0+FIX[a].x1)*.33)-((FIX[b].y0+FIX[b].y1)*.65-(FIX[b].x0+FIX[b].x1)*.33));
const UX=[1.25,-.22], UY=[.5,.58];
function P(px,py,pz,m){return [m.ox+(px*UX[0]+py*UY[0])*m.k, m.oy+(px*UX[1]+py*UY[1]-pz)*m.k]}
function mapFit(cx,cy,w){ // scale and origin so the shell is centred at (cx,cy) and w wide
  const pts=[[90,145],[1160,221],[1160,610],[90,610]].map(([a,b])=>[a*UX[0]+b*UY[0],a*UX[1]+b*UY[1]]);
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),k=w/(Math.max(...xs)-Math.min(...xs));
  return {k,ox:cx-(Math.max(...xs)+Math.min(...xs))/2*k,oy:cy-(Math.max(...ys)+Math.min(...ys))/2*k+18*k}}
function poly(pts){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath()}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(f<0?v*(1+f):v+(255-v)*f);return `rgb(${m(r)},${m(g)},${m(b)})`}
function box(f,m,lit,dim,t,lift){ // top, south and west faces
  const h=f.h+lift,p=(a,b,z)=>P(a,b,z,m),{x0,y0,x1,y1}=f;
  const base=lit>0?lerpCol(f.col||'#E9E3D8','#FFD45C',lit):(f.col||'#E9E3D8');
  x.save();x.globalAlpha=1-dim*.55;
  poly([p(x0,y1,lift),p(x1,y1,lift),p(x1,y1,h),p(x0,y1,h)]);x.fillStyle=shade(base,-.10);x.fill();   // south face
  poly([p(x0,y0,lift),p(x0,y1,lift),p(x0,y1,h),p(x0,y0,h)]);x.fillStyle=shade(base,-.2);x.fill();     // west face
  poly([p(x0,y0,h),p(x1,y0,h),p(x1,y1,h),p(x0,y1,h)]);x.fillStyle=shade(base,.25);x.fill();          // top
  if(!f.flat){ // shelf lines / chiller doors on the south face
    x.strokeStyle=lit>0?`rgba(160,100,10,${.35*lit+.15})`:'rgba(120,110,95,.28)';x.lineWidth=1.2;
    if(f.glass){for(let k=1;k<6;k++){const a=lerp(x0,x1,k/6);x.beginPath();const q1=p(a,y1,lift+4),q2=p(a,y1,h-4);x.moveTo(...q1);x.lineTo(...q2);x.stroke()}}
    else{for(let k=1;k<4;k++){const z=lift+(h-lift)*k/4;x.beginPath();x.moveTo(...p(x0,y1,z));x.lineTo(...p(x1,y1,z));x.stroke()}}}
  x.strokeStyle=lit>0?`rgba(170,110,0,${.6*lit})`:'rgba(110,100,85,.35)';x.lineWidth=1.3;
  poly([p(x0,y0,h),p(x1,y0,h),p(x1,y1,h),p(x0,y1,h)]);x.stroke();
  x.restore();}
function lerpCol(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ch=s=>[s>>16,s>>8&255,s&255];const A=ch(pa),Bc=ch(pb);return '#'+A.map((v,i)=>Math.round(lerp(v,Bc[i],t)).toString(16).padStart(2,'0')).join('')}
function beam(f,m,a,t){ // warm light pool on the floor and a faint shaft falling onto the lit fixture
  if(a<=0)return;const {x0,y0,x1,y1}=f,h=f.h+6,p=(q,r,z)=>P(q,r,z,m),top=h+190;
  const fc=p((x0+x1)/2,(y0+y1)/2,0),rx=(Math.abs(x1-x0)*1.25+Math.abs(y1-y0)*.5)*m.k*.62+42*m.k;
  x.save();const fg=x.createRadialGradient(fc[0],fc[1],2,fc[0],fc[1],rx);fg.addColorStop(0,`rgba(255,190,60,${.34*a})`);fg.addColorStop(1,'rgba(255,190,60,0)');
  x.fillStyle=fg;x.beginPath();x.ellipse(fc[0],fc[1],rx,rx*.55,-.2,0,7);x.fill();
  const c1=p((x0+x1)/2,(y0+y1)/2,h),c2=p((x0+x1)/2,(y0+y1)/2,top),g=x.createLinearGradient(c1[0],c1[1],c2[0],c2[1]);
  g.addColorStop(0,`rgba(255,200,80,${.22*a})`);g.addColorStop(1,'rgba(255,200,80,0)');
  poly([p(x0,y1,h),p(x1,y1,h),p(x1,y0,h),p(x1,y0,top),p(x0,y0,top),p(x0,y1,top)]);x.fillStyle=g;x.fill();x.restore();}
const ENTR=[60,385];
function pathLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function drawPath(pts,prog,m,alpha){ // dotted walking route from the door, drawn on the floor
  if(prog<=0||alpha<=0)return;const L=pathLen(pts),stop=L*cl(prog);let acc=0;
  x.save();x.globalAlpha=alpha;x.strokeStyle=NAVY;x.lineWidth=Math.max(2.4,5*m.k);x.lineCap='round';x.setLineDash([.1,12*m.k*1.6]);
  x.beginPath();x.moveTo(...P(pts[0][0],pts[0][1],1,m));let end=pts[0];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(acc+d>=stop){const f=(stop-acc)/d;end=[lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)];x.lineTo(...P(end[0],end[1],1,m));break}acc+=d;end=pts[i];x.lineTo(...P(pts[i][0],pts[i][1],1,m))}
  x.stroke();x.setLineDash([]);
  const e=P(end[0],end[1],1,m);x.fillStyle=NAVY;x.beginPath();x.arc(e[0],e[1],Math.max(5,9*m.k),0,7);x.fill();x.restore();}
function drawShop(m,lit,litAmt,dimAmt,pathPts,pathProg,pathAlpha,t,extraLit){
  // floor and the two back walls
  const p=(a,b,z)=>P(a,b,z,m);
  poly([p(90,145,0),p(1160,221,0),p(1160,610,0),p(90,610,0)]);x.fillStyle='#ECE5D8';x.fill();
  x.strokeStyle='rgba(16,16,57,.55)';x.lineWidth=Math.max(1.5,3*m.k);x.stroke();
  poly([p(90,145,0),p(1160,221,0),p(1160,221,40),p(90,145,40)]);x.fillStyle='rgba(205,196,182,.55)';x.fill();
  poly([p(1160,221,0),p(1160,610,0),p(1160,610,40),p(1160,221,40)]);x.fillStyle='rgba(190,181,166,.55)';x.fill();
  // entrance: a gap in the left wall and a label
  const e1=p(90,345,0),e2=p(90,410,0);x.strokeStyle='#ECE5D8';x.lineWidth=Math.max(3,6*m.k);x.beginPath();x.moveTo(...e1);x.lineTo(...e2);x.stroke();
  const el=p(40,400,0);x.save();x.globalAlpha=.9;txt('ENTRANCE',el[0]-6,el[1]+26*m.k+8,Math.max(13,22*m.k),700,NAVY,'right',400,1.5);x.restore();
  drawPath(pathPts,pathProg,m,pathAlpha);
  for(const id of ORDER){const L=Math.max(lit.includes(id)?litAmt:0,(extraLit&&extraLit[id])||0);if(L>0)beam(FIX[id],m,L*(.88+.12*Math.sin(t*5))*(extraLit?.6:1),t)}
  for(const id of ORDER){const f=FIX[id],L=Math.max(lit.includes(id)?litAmt:0,(extraLit&&extraLit[id])||0),dim=L>0?0:dimAmt;
    box(f,m,L,f.flat?dimAmt*.5:dim,t,6*L)}
  // the door marker
  const dm=p(ENTR[0]+30,ENTR[1],1);x.save();x.fillStyle=NAVY;x.beginPath();x.arc(dm[0],dm[1],Math.max(5,8*m.k),0,7);x.fill();
  const pr=(t*1.2)%1;x.strokeStyle=`rgba(16,16,57,${.45*(1-pr)})`;x.lineWidth=2;x.beginPath();x.arc(dm[0],dm[1],Math.max(5,8*m.k)+pr*26*m.k,0,7);x.stroke();x.restore();}

/* ---------------- chrome ---------------- */
function header(a=1){if(a<=0)return;x.save();x.globalAlpha=a;const lg=IMG.logo,lh=56,lw=lh*lg.width/lg.height;x.drawImage(lg,70,113,lw,lh);
  txt('MORE IN STORE',1010,152,24,700,NAVY,'right',400,2.2);x.fillStyle=RULE;x.fillRect(70,198,940,2);x.restore()}
function footer(i,alc,a=1){if(a<=0)return;x.save();x.globalAlpha=a;x.fillStyle=RULE;x.fillRect(70,1700,940,2);
  txt('210 High Road, South Benfleet · SS7 5LD',70,1756,27,600);
  if(i>=0)txt(String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'),1010,1756,27,600,NAVY,'right');else txt('@cocolocal_',1010,1756,27,600,NAVY,'right');
  txt(alc?'Varieties as stocked · Subject to availability · 18+ · Please drink responsibly':'Varieties as stocked · Subject to availability',70,1800,21,500,MUTED,'left',940);x.restore()}

/* ---------------- the tab bar: chips + a liquid puck ---------------- */
const TB={y:222,h:58,pad:26,gap:12,fs:23};let CHIPS=null;
function chips(){if(CHIPS)return CHIPS;let px=0;CHIPS=COL.map(c=>{const w=tw(c.tab,TB.fs,600)+TB.pad*2,o={x:px,w};px+=w+TB.gap;return o});CHIPS.total=px-TB.gap;return CHIPS}
function tabBar(t,b,a){if(a<=0)return;const C=chips(),i=Math.max(0,sec(b));
  // scroll so the active chip sits near the centre, clamped to the row
  const keys=[[0,0]];for(let k=1;k<N;k++)keys.push([T0+SEC*k,k]);
  const scrollFor=k=>Math.max(0,Math.min(C.total-940,C[k].x+C[k].w/2-470));
  let sc=scrollFor(0);for(let k=1;k<N;k++)sc+=(scrollFor(k)-scrollFor(k-1))*s(t-(T0+SEC*k)*B,SP.soft);
  // puck edges: leading edge fast, trailing edge slow -> a liquid stretch
  let L=C[0].x,R=C[0].x+C[0].w;for(let k=1;k<N;k++){const tk=t-(T0+SEC*k)*B;L+=(C[k].x-C[k-1].x)*s(tk,SP.trail);R+=(C[k].x+C[k].w-C[k-1].x-C[k-1].w)*s(tk,SP.lead)}
  const ox=70-sc,y=TB.y+(1-a)*-40;
  x.save();x.globalAlpha=a;x.beginPath();x.rect(56,TB.y-6,968,TB.h+12);x.clip();
  C.forEach((ch,k)=>{rr(ox+ch.x,y,ch.w,TB.h,TB.h/2);x.strokeStyle='rgba(16,16,57,.16)';x.lineWidth=2;x.stroke()});
  C.forEach((ch,k)=>txt(COL[k].tab,ox+ch.x+ch.w/2,y+38,TB.fs,600,NAVY,'center',2000));
  rr(ox+L,y,R-L,TB.h,TB.h/2);x.fillStyle=NAVY;x.fill();
  x.save();rr(ox+L,y,R-L,TB.h,TB.h/2);x.clip();C.forEach((ch,k)=>txt(COL[k].tab,ox+ch.x+ch.w/2,y+38,TB.fs,600,CREAM,'center',2000));x.restore();
  // soft fade at the row edges
  const g1=x.createLinearGradient(56,0,110,0);g1.addColorStop(0,CREAM);g1.addColorStop(1,'rgba(245,240,230,0)');x.fillStyle=g1;x.fillRect(56,TB.y-6,54,TB.h+12);
  const g2=x.createLinearGradient(1024,0,970,0);g2.addColorStop(0,CREAM);g2.addColorStop(1,'rgba(245,240,230,0)');x.fillStyle=g2;x.fillRect(970,TB.y-6,54,TB.h+12);
  x.restore();return {ox,y}}
function chipCentre(k,t){const C=chips();let sc=Math.max(0,Math.min(C.total-940,C[0].x+C[0].w/2-470));
  const scrollFor=j=>Math.max(0,Math.min(C.total-940,C[j].x+C[j].w/2-470));for(let j=1;j<N;j++)sc+=(scrollFor(j)-scrollFor(j-1))*s(t-(T0+SEC*j)*B,SP.soft);
  return [70-sc+C[k].x+C[k].w/2,TB.y+TB.h/2]}

/* ---------------- layout of a collection page ---------------- */
const CARD={x:56,y:528,w:968,h:645,r:34}, MAP={x:56,y:1262,w:968,h:398,r:30};
const GRID=(k)=>{const col=k%3,row=Math.floor(k/3);return k===N?{x:68+322,y:590+row*222,w:622,h:172}:{x:68+col*322,y:590+row*222,w:300,h:172}};
const COVERC=[{x:70,y:815,w:450,h:300},{x:550,y:815,w:450,h:300},{x:70,y:1145,w:450,h:300},{x:550,y:1145,w:450,h:300}];
const COVER_IDX=[0,3,5,7]; // slushies, sweets, DIY, pets -> the cover's four photos
const POP_IDX=[...Array(N+1).keys()].filter(k=>!COVER_IDX.includes(k)); // the rest pop in on 16ths

function photoCard(t,b,rect,alpha){ // the persistent card; the photo swipes between collections
  const i=Math.max(0,sec(b));x.save();x.globalAlpha=alpha;
  x.save();x.shadowColor='rgba(60,45,30,.16)';x.shadowBlur=30;x.shadowOffsetY=12;rr(rect.x,rect.y,rect.w,rect.h,rect.r);x.fillStyle='#EFE6D8';x.fill();x.restore();
  x.save();rr(rect.x,rect.y,rect.w,rect.h,rect.r);x.clip();
  const k=i,tk=t-(T0+SEC*k)*B,sw=k>0?s(tk,SP.ui):1;
  if(k>0&&sw<1){x.save();x.translate(-sw*rect.w*1.04,0);cover(IMG[COL[k-1].id],rect.x,rect.y,rect.w,rect.h);x.restore()}
  x.save();x.translate((1-sw)*rect.w*1.04,0);cover(IMG[COL[k].id],rect.x,rect.y,rect.w,rect.h);x.restore();
  x.restore();x.restore()}

function pageText(t,b,a){ // eyebrow, headline, subline (exit up, enter from below, masked)
  if(a<=0)return;const i=Math.max(0,sec(b));
  const one=(k,ph)=>{const c=COL[k],t0=(T0+SEC*k)*B,eIn=s(t-t0-.12-ph*.06,SP.ui),eOut=k<N-1?s(t-(T0+SEC*(k+1))*B+.02,SP.snap):0;
    const dy=(1-eIn)*70-eOut*70,al=cl(eIn*1.6)*(1-cl(eOut*1.6));return {c,dy,al}};
  const draw=(k)=>{const q=one(k,0),q2=one(k,1),q3=one(k,2);
    masked(306,46,()=>{x.save();x.globalAlpha=a*q.al;txt(q.c.eyebrow,70,340+q.dy*.5,24,700,BROWN,'left',940,2.8);x.restore()});
    masked(352,100,()=>{x.save();x.globalAlpha=a*q2.al;txt(q2.c.headline,70,432+q2.dy,84,700,NAVY,'left',940);x.restore()});
    masked(452,56,()=>{x.save();x.globalAlpha=a*q3.al;txt(q3.c.sub,70,490+q3.dy*.6,30,500,MUTED,'left',940);x.restore()});};
  if(i>0&&t<(T0+SEC*i)*B+.4)draw(i-1);draw(i);}

function mapPanel(t,b,rect,a,bigK){ // "Find it in store": the isometric shop with the lit shelves, shelf photo and a location pill
  if(a<=0)return;const i=Math.max(0,sec(b)),t0=(T0+SEC*i)*B,first=i===0;
  x.save();x.globalAlpha=a;
  txt('FIND IT IN STORE',rect.x+14,rect.y-22,22,700,BROWN,'left',600,2.6);
  rr(rect.x,rect.y,rect.w,rect.h,rect.r);x.fillStyle='#FBF8F2';x.fill();x.strokeStyle='rgba(16,16,57,.08)';x.lineWidth=2;x.stroke();
  x.save();rr(rect.x,rect.y,rect.w,rect.h,rect.r);x.clip();
  const m=mapFit(rect.x+rect.w*.53,rect.y+rect.h*.5,rect.w*.84*(bigK||1));
  // light timing: the old set fades as the tab changes; the new set lights on the beat
  const lt=t0+(first?2:1.5)*B, litA=s(t-lt,SP.pop), outA=i<N-1?s(t-(T0+SEC*(i+1))*B,SP.snap):0;
  const prevLit=i>0?COL[i-1].lit:[], prevA=i>0?(1-s(t-t0,SP.snap)):0;
  const lA=cl(litA)*(1-cl(outA)), dimA=Math.max(cl(litA),prevA)*(1-cl(outA)*.0);
  const pp=s(t-lt-.05,SP.soft)*(1-outA), pathA=(1-cl(outA*2));
  const lit=lA>0.002?COL[i].lit:prevLit, amt=lA>0.002?lA:prevA;
  drawShop(m,lit,amt,dimA*.8,COL[i].path,lA>0.002?pp:0,pathA,t);
  x.restore();
  // shelf photo: a polaroid on the photo card's corner ("on our shelves")
  const ta=s(t-lt-.5*B,SP.pop)*(1-cl(outA*2)),tw_=168,th_=156,thx=CARD.x+CARD.w-tw_/2-34,thy=CARD.y+CARD.h-th_/2+40;

/* ---------------- the finger: a touch indicator that moves on springs and taps on the beat ---------------- */
function finger(t,b){const taps=[[7.5,'grid0']];for(let k=1;k<N;k++)taps.push([T0+SEC*k,'chip'+k]);
  const posOf=(id,tt)=>{if(id==='grid0'){const g=GRID(0);return [g.x+g.w*.55,g.y+g.h*.6]}const k=+id.slice(4);const c=chipCentre(k,tt);return [c[0],c[1]+6]};
  // visible from 6.5 to the last tap + 1
  if(b<6.4||b>T0+SEC*(N-1)+1.2)return;
  // target: before each tap, glide there over ~0.9 beat
  let cur=null,prev=null,tap=null;for(const tp of taps){if(b<tp[0]+.6){cur=tp;break}prev=tp}
  if(!cur){cur=taps[taps.length-1];}
  const arriveFrom=prev?posOf(prev[1],prev[0]*B+.6):[920,1600],dest=posOf(cur[1],t);
  const g=s(t-(cur[0]-1.2)*B,SP.soft),px=lerp(arriveFrom[0],dest[0],g),py=lerp(arriveFrom[1],dest[1],g);
  const dt=t-cur[0]*B,press=dt>-.06&&dt<.14?1-Math.abs((dt-.04)/.1):0,ripple=dt>0&&dt<.5?dt/.5:-1;
  const fadeIn=cl((b-(cur[0]-1.4))/.4),fadeOut=1-cl((b-(cur[0]+.45))/.4);
  x.save();x.globalAlpha=fadeIn*fadeOut;
  if(ripple>=0){x.strokeStyle=`rgba(16,16,57,${.5*(1-ripple)})`;x.lineWidth=3;x.beginPath();x.arc(px,py,30+ripple*46,0,7);x.stroke()}
  const r=30*(1-.18*cl(press));x.fillStyle='rgba(16,16,57,.28)';x.beginPath();x.arc(px,py,r,0,7);x.fill();
  x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=4;x.stroke();x.restore()}

/* ---------------- opener: the real shopfront, then a push through the door into the app ---------------- */

  const fx=DOORF[0]*im.width,fy=DOORF[1]*im.height,p0=[r.x+r.w/2+(fx-im.width/2)*base,r.y+r.h/2+(fy-im.height/2)*base],cx=r.x+r.w/2,cy=r.y+r.h/2;
