<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F2EF;--surface:#FFFFFF;--ink:#0F1A33;--muted:#555D70;--line:#DCD9D3;--accent:#C9763A;--btn:#0F1A33;--btn-ink:#FFFFFF;--ok:#1E7B4B;--bad:#B3261E;--chip:#E6E3DE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0B1326;--surface:#131E38;--ink:#ECEAE7;--muted:#A5ADBF;--line:#26324F;--accent:#FEC091;--btn:#FEC091;--btn-ink:#0F1A33;--ok:#6FD39C;--bad:#FF8A80;--chip:#1C2847}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1326;--surface:#131E38;--ink:#ECEAE7;--muted:#A5ADBF;--line:#26324F;--accent:#FEC091;--btn:#FEC091;--btn-ink:#0F1A33;--ok:#6FD39C;--bad:#FF8A80;--chip:#1C2847}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:32px 64px}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:22px}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;font-weight:600;text-wrap:balance}
h2{font-size:19px;margin:0;font-weight:600}
p{margin:0;max-width:64ch}
.muted{color:var(--muted)}
section{display:grid;gap:10px}
.shead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.shead a{font-size:13px;color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{font-size:14px;word-break:break-all}
.size{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:progress}
.btn.done{background:transparent;color:var(--ok);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#status{font-weight:500;min-height:1.5em}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.nav a{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface)}
.nav a[aria-current]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
@media (max-width:520px){li{grid-template-columns:1fr auto}.size{grid-column:1}}
</style>

<div class="wrap">
  <p class="kicker">Coco Local motion kit · page __N__ of __TOTAL__</p>
  <h1>__HEADING__</h1>
  <p class="muted">Full original quality, nothing re-compressed. Press Download on each file, then drag it into the Drive folder shown for its group (inside <a href="https://drive.google.com/drive/folders/1m8yIoYK-5VUiEc3kP0F9TvTMKdwcWHND">05 — Brand Motion Kit</a>).</p>
  <nav class="nav" aria-label="Download pages">__NAV__</nav>
  <p id="status" aria-live="polite"></p>
  <div id="list"></div>
</div>

<script>
const FILES = /*FILES*/[];
const $ = s => document.querySelector(s);
const status = t => { $("#status").textContent = t; };
let dl = null; const dlReady = (window.claude && claude.use) ? claude.use("downloads").then(d => (dl = d)) : Promise.resolve(null);
const groups = {}; FILES.forEach(f => { (groups[f.group + "|" + f.folderName + "|" + f.folder] ||= []).push(f); });
for (const [key, files] of Object.entries(groups)) {
  const [g, fname, fid] = key.split("|");
  const s = document.createElement("section");
  const h = document.createElement("div"); h.className = "shead";
  const h2 = document.createElement("h2"); h2.textContent = g;
  const a = document.createElement("a"); a.href = `https://drive.google.com/drive/folders/${fid}`; a.textContent = `Drive folder: ${fname} ↗`;
  h.append(h2, a); s.appendChild(h);
  const ul = document.createElement("ul");
  for (const f of files) {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.className = "name"; n.textContent = f.title;
    const z = document.createElement("span"); z.className = "size"; z.textContent = `${f.mb.toFixed(1)} MB`;
    const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Download";
    b.setAttribute("aria-label", `Download ${f.title}`);
    b.onclick = () => save(f, b);
    li.append(n, z, b); ul.appendChild(li);
  }
  s.appendChild(ul); $("#list").appendChild(s);
}
async function save(f, b) {
  const d = dl || await dlReady;
  if (!d) { status("Downloads aren't available in this view. Open this page on claude.ai."); return; }
  b.disabled = true; status(`Preparing ${f.title}…`);
  try {
    const parts = await Promise.all(f.parts.map(async p => { const r = await fetch(p); if (!r.ok) throw new Error(`couldn't load ${p} (${r.status})`); return r.blob(); }));
    const blob = new Blob(parts, { type: "video/mp4" });   // parts join back into the exact original file
    await d.save({ filename: f.title, data: blob });
    b.textContent = "Saved ✓"; b.classList.add("done"); status(`Saved ${f.title}`);
  } catch (err) {
    status(err && err.code === "declined" ? "Download cancelled." : err && err.code === "rate_limited" ? "Finish the open save prompt first." : `Couldn't save ${f.title}: ${err && err.message || err}`);
  }
  b.disabled = false;
}
</script>
