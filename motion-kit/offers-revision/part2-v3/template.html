<!doctype html><html><head><meta charset="utf-8"><title>Coco Local — Offers Part 2 v3</title><style>__FONTS__
html,body{margin:0;background:#F7F3EA;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
/* Offers Part 2 — v3 motion.  Every frame is a pure function of time: seek(t).
   One hero action per offer, then a readable hold.  No sliced wobble, no orbits, no label-wrap spins, no see-through products. */
const CFG=__CFG__, M=__META__, IMG={};
const B=60/124, W=1080, H=1920, c=document.getElementById('c'), x=c.getContext('2d');
const NAVY='#101039', CREAM='#F7F3EA', MUTED='#5E5B6B', PEACH='#F5C49B', RULE='#DDD5C7';
const cl=v=>Math.min(1,Math.max(0,v)), lerp=(a,b,t)=>a+(b-a)*t;
const eo3=t=>1-Math.pow(1-cl(t),3), eo5=t=>1-Math.pow(1-cl(t),5), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function spring(t,w=18,z=.8){if(t<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t));}
function txt(s,px,py,size,weight=600,color=NAVY,align='left',max=940,track=0){x.font=`${weight} ${size}px Poppins`;x.letterSpacing=track+'px';let m=x.measureText(s).width;if(m>max){size*=max/m;x.font=`${weight} ${size}px Poppins`;}x.fillStyle=color;x.textAlign=align;x.fillText(s,px,py);x.letterSpacing='0px';return size}
function measure(s,size,weight=700){x.font=`${weight} ${size}px Poppins`;return x.measureText(s).width}
function rrect(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}

/* ---------------- stage: warm backdrop, travertine plinth, contact shadows ---------------- */
const ST={x:56,y:660,w:968,h:900,r:40}, PL={cx:540,cy:1405,rx:400,ry:58,side:96};
let noise;
function makeNoise(){noise=document.createElement('canvas');noise.width=noise.height=256;const g=noise.getContext('2d'),d=g.createImageData(256,256);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<d.data.length;i+=4){const v=r();const pit=v>.985;d.data[i]=d.data[i+1]=d.data[i+2]=pit?150:(v*40+200);d.data[i+3]=pit?90:18}g.putImageData(d,0,0)}
function stage(o,t){const g=x.createLinearGradient(0,ST.y,0,ST.y+ST.h);g.addColorStop(0,o.back[0]);g.addColorStop(1,o.back[1]);
  x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.fillStyle=g;x.fill();x.clip();
  const lg=x.createRadialGradient(300,ST.y+120,40,300,ST.y+160,760);lg.addColorStop(0,'rgba(255,250,240,.75)');lg.addColorStop(1,'rgba(255,250,240,0)');x.fillStyle=lg;x.fillRect(ST.x,ST.y,ST.w,ST.h);x.restore();}
function plinth(){x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();
  const {cx,cy,rx,ry,side}=PL;
  // soft floor shadow
  const fs=x.createRadialGradient(cx,cy+side+10,20,cx,cy+side+10,rx*1.25);fs.addColorStop(0,'rgba(90,70,50,.22)');fs.addColorStop(1,'rgba(90,70,50,0)');x.fillStyle=fs;x.beginPath();x.ellipse(cx,cy+side+14,rx*1.25,ry*1.3,0,0,7);x.fill();
  // side band
  const sg=x.createLinearGradient(cx-rx,0,cx+rx,0);sg.addColorStop(0,'#CDBFAC');sg.addColorStop(.35,'#E6DBCC');sg.addColorStop(.7,'#DCCFBE');sg.addColorStop(1,'#BFAF9A');
  x.beginPath();x.moveTo(cx-rx,cy);x.lineTo(cx-rx,cy+side);x.ellipse(cx,cy+side,rx,ry,0,Math.PI,0,true);x.lineTo(cx+rx,cy);x.ellipse(cx,cy,rx,ry,0,0,Math.PI,false);x.closePath();x.fillStyle=sg;x.fill();
  x.save();x.clip();x.globalAlpha=.9;x.fillStyle=x.createPattern(noise,'repeat');x.fillRect(cx-rx,cy-ry,rx*2,side+ry*2);x.restore();
  // top
  const tg=x.createLinearGradient(0,cy-ry,0,cy+ry);tg.addColorStop(0,'#F4EDE3');tg.addColorStop(1,'#E7DDCF');x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fillStyle=tg;x.fill();
  x.save();x.clip();x.fillStyle=x.createPattern(noise,'repeat');x.fillRect(cx-rx,cy-ry,rx*2,ry*2);x.restore();
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;x.beginPath();x.ellipse(cx,cy,rx-2,ry-2,0,Math.PI*1.05,Math.PI*1.95);x.stroke();x.restore();}
function contact(px,w,k){if(k<=0)return;x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();const g=x.createRadialGradient(px,PL.cy,2,px,PL.cy,w*.62);g.addColorStop(0,`rgba(60,45,30,${.32*k})`);g.addColorStop(1,'rgba(60,45,30,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,PL.cy+2,w*.62,w*.12,0,0,7);x.fill();x.restore();}

/* ---------------- products: solid, land on one shared baseline ---------------- */
function layout(o){const P=M.products[o.id],n=P.length,hgt=o.prodH,gap=o.gap;const ws=P.map(p=>p.w/p.h*hgt);const tw=ws.reduce((a,v)=>a+v,0)+gap*(n-1);let px=540-tw/2;
  return P.map((p,j)=>{const cx=px+ws[j]/2;px+=ws[j]+gap;return {img:IMG[p.src],cx,w:ws[j],h:hgt,base:PL.cy+6}})}
function drawProduct(p,lt,kind,extra=0){ // lt = seconds since landing time (negative = still falling)
  const fall=lt<0?Math.pow(cl(1+lt/.34),2):1, dropY=(1-fall)*-900;         // accelerate in from above
  const settle=lt>0?Math.exp(-lt*10)*Math.sin(lt*34)*(kind==='bag'?10:5):0; // one small damped rebound
  const squash=kind==='bag'&&lt>0?1-.035*Math.exp(-lt*14):1;
  const pop=extra; if(lt<-.34)return 0;
  x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();x.translate(p.cx,p.base+dropY-settle);x.scale((2-squash)*(1+pop),squash*(1+pop));
  x.shadowColor='rgba(40,30,20,.18)';x.shadowBlur=22;x.shadowOffsetY=10;x.drawImage(p.img,-p.w/2,-p.h,p.w,p.h);x.restore();return lt<0?0:cl(lt*4)}

/* ---------------- liquid: poured along its own path (geodesic progress map) ---------------- */
const LQ={};
function prepLiquid(name){const L=M.liquids[name],u=IMG[L.umap],uw=u.width,uh=u.height;const cv=document.createElement('canvas');cv.width=uw;cv.height=uh;const g=cv.getContext('2d');g.drawImage(u,0,0);
  const ud=g.getImageData(0,0,uw,uh).data,U=new Float32Array(uw*uh);for(let i=0;i<U.length;i++)U[i]=ud[i*4]/255;
  const mask=document.createElement('canvas');mask.width=uw;mask.height=uh;const work=document.createElement('canvas');work.width=L.w;work.height=L.h;
  LQ[name]={L,U,uw,uh,mask,mctx:mask.getContext('2d'),md:mask.getContext('2d').createImageData(uw,uh),work,wctx:work.getContext('2d')};}
function liquidLayer(name,p,shine){ // p: pour front 0..1+, shine: 0..1 position of a travelling highlight (or -1)
  const Q=LQ[name],{U,md}=Q,d=md.data,f=.045;
  for(let i=0;i<U.length;i++){const u=U[i];let a=cl((p-u)/f);d[i*4+3]=a*255;d[i*4]=d[i*4+1]=d[i*4+2]=255;}
  Q.mctx.putImageData(md,0,0);const w=Q.wctx;w.globalCompositeOperation='source-over';w.clearRect(0,0,Q.work.width,Q.work.height);w.drawImage(IMG[Q.L.ribbon],0,0);
  w.globalCompositeOperation='destination-in';w.imageSmoothingEnabled=true;w.drawImage(Q.mask,0,0,Q.work.width,Q.work.height);w.globalCompositeOperation='source-over';
  if(shine>=0){ // slow travelling sheen: the liquid keeps flowing in slow motion while it holds still
    for(let i=0;i<U.length;i++){const du=U[i]-shine;d[i*4+3]=255*Math.exp(-du*du/.0035)*(U[i]<p?1:0);}Q.mctx.putImageData(md,0,0);
    const tmp=Q.tmp||(Q.tmp=document.createElement('canvas'));tmp.width=Q.work.width;tmp.height=Q.work.height;const tg=tmp.getContext('2d');tg.drawImage(IMG[Q.L.ribbon],0,0);tg.globalCompositeOperation='destination-in';tg.drawImage(Q.mask,0,0,tmp.width,tmp.height);
    w.globalCompositeOperation='screen';w.globalAlpha=.28;w.drawImage(tmp,0,0);w.globalAlpha=1;w.globalCompositeOperation='source-over';}
  return Q.work;}
function pourTime(u,t0,dur){const q=cl(u/1.06);return t0+dur*(1-Math.cbrt(1-q));} // inverse of p = 1.06*eo3((t-t0)/dur)
function drawDroplets(name,tf,t,t0,dur,front){const L=M.liquids[name];x.save();x.translate(tf.x,tf.y);x.scale(tf.s,tf.s);x.rotate(tf.r||0);
  L.drops.forEach((d,j)=>{const isFront=d.area<260&&(j%3===0);if(isFront!==front)return;
    const ts=pourTime(d.u,t0,dur),dt=t-ts;if(dt<0)return;
    const fx=d.x+d.w/2,fy=d.y+d.h/2,fl=eo3(dt/.42),drift=1-Math.exp(-Math.max(0,dt-.42)*.5);
    const vx=fx-d.sx,vy=fy-d.sy,px=d.sx+vx*fl+vx*.06*drift,py=d.sy+vy*fl+vy*.06*drift+10*drift;
    const sc=lerp(.45,1,eo3(dt/.3));x.globalAlpha=cl(dt*12);x.drawImage(IMG[d.src],px-d.w/2*sc,py-d.h/2*sc,d.w*sc,d.h*sc)});x.restore();}

/* ---------------- crisps: purposeful ballistic bursts that hang at their apex (speed ramp) ---------------- */
const G=2600,K=2.2;
function crispPos(c,tau){const e=1-Math.exp(-K*tau);return [c.x0+c.vx*e/K, c.y0+(c.vy-G/K)*e/K+G*tau/K]}
function setupCrisp(c){ // canvas y points down; reach (tx,ty) exactly at the top of the arc at physics time th
  const th=c.th,e=1-Math.exp(-K*th);c.vy=G/K-(G/K)*Math.exp(K*th);const dy=(c.vy-G/K)*e/K+G*th/K;c.y0=c.ty-dy;c.vx=(c.tx-c.x0)*K/e;return c}
function warp(t,t0,th,tExit){ // physics time: real speed up to just before the apex, a smooth slow-down to 2% (speed ramp), then fast again for the exit
  let tau=0,dt=1/480;const a0=Math.max(.05,th-.12);for(let u=t0;u<t;u+=dt){const a=u-t0;let s=a<a0?1:a<a0+.32?lerp(1,.02,eio((a-a0)/.32)):.02;if(u>tExit)s=lerp(.02,1.6,eio((u-tExit)/.35));tau+=s*Math.min(dt,t-u);}return tau}
const CR=document.createElement('canvas'),crx=CR.getContext('2d');CR.width=CR.height=420;
function drawCrisp(c,t,t0,tExit){const lt=t-t0-c.delay;if(lt<0)return;const tau=warp(t,t0+c.delay,c.th,tExit),[px,py]=crispPos(c,tau),dth=tau-c.th;
  const rot=c.rot+c.wz*dth,flip=c.flip+c.wf*dth,cf=Math.cos(flip),sp=M.crisps[c.sprite],im=IMG[sp.src],sz=c.size,sh=sz*sp.h/sp.w;
  // shade on a private canvas: the far side of a tumbling crisp is a little darker and oilier
  crx.clearRect(0,0,420,420);crx.globalCompositeOperation='source-over';crx.drawImage(im,210-sz/2,210-sh/2,sz,sh);
  const dark=cf<0?.22+.18*(1-Math.abs(cf)):.12*(1-Math.abs(cf));if(dark>0){crx.globalCompositeOperation='source-atop';crx.fillStyle=`rgba(110,60,5,${dark})`;crx.fillRect(0,0,420,420);}
  x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();x.translate(px,py);x.rotate(rot);x.scale(c.mirror,Math.max(.12,Math.abs(cf)));
  if(c.back)x.filter='blur(1.4px) saturate(.9)';x.globalAlpha=cl(lt*10);x.drawImage(CR,-210,-210);x.filter='none';x.restore();}

/* ---------------- copy ---------------- */
function header(){const lg=IMG.logo,lh=58,lw=lh*lg.width/lg.height;x.drawImage(lg,70,112,lw,lh);txt('OFFERS · PART 2',1010,152,24,600,NAVY,'right',400,2.4);x.fillStyle=RULE;x.fillRect(70,198,940,2)}
function footer(o){x.fillStyle=RULE;x.fillRect(70,1618,940,2);txt('210 High Road, South Benfleet · SS7 5LD',70,1682,29,600);txt('@cocolocal_',1010,1682,27,600,NAVY,'right');
  txt(o.alcohol?'Varieties as stocked · Subject to availability · 18+ · Please drink responsibly':'Varieties as stocked · Subject to availability',70,1730,22,500,MUTED,'left',940)}
function masked(y0,h,fn){x.save();x.beginPath();x.rect(0,y0,W,h);x.clip();fn();x.restore()}

/* ---------------- one offer scene ---------------- */
function offer(o,t,tt){ // t = seconds into the scene; tt = timing table (beats)
  const b=t/B; x.fillStyle=CREAM;x.fillRect(0,0,W,H);header();
  // eyebrow types on 16ths, headline lines rise out of a mask
  const ne=Math.max(0,Math.min(o.eyebrow.length,Math.floor((b-tt.copy)*16)+1));txt(b<tt.copy?'':o.eyebrow.slice(0,ne),70,272,25,600,'#8A5A2E','left',940,2.8);
  const h1=spring(t-(tt.copy+.25)*B,16,.86);masked(288,92,()=>txt(o.headline,70,358+(1-h1)*96,72,700));
  // price: qualifier leads in, value slams on the beat
  const q=spring(t-(tt.price-.5)*B,16,.86),pv=spring(t-(tt.price-.04)*B,20,.62);
  const size=o.priceSize,lead=o.priceLead,val=o.priceValue,lw=lead?measure(lead+' ',size):0,vw=measure(val,size);let s=Math.min(1,940/(lw+vw)),fs=size*s;
  masked(400,130,()=>{if(lead)txt(lead,70,502+(1-q)*120,fs,700,NAVY,'left',2000);});
  if(pv>0){const px=70+lw*s,cy=470;x.save();x.translate(px,cy);const sc=lerp(1.6,1,cl(pv))+.06*(pv-cl(pv));x.scale(sc,sc);x.globalAlpha=cl(pv*3);txt(val,0,32,fs,700,o.valueColor||NAVY,'left',2000);x.restore();}
  const d1=eo3((t-(tt.price+.5)*B)/.35),d2=eo3((t-(tt.price+.75)*B)/.35);
  x.save();x.globalAlpha=d1;txt(o.detail,70,572+(1-d1)*16,31,500);x.restore();
  if(o.saving){x.save();x.globalAlpha=d2;txt(o.saving,70,616+(1-d2)*14,25,500,MUTED);x.restore();}
  // stage with a slow camera push through the hold
  const push=1+.03*eio((t-tt.price*B)/(8*B));
  x.save();x.translate(540,1110);x.scale(push,push);x.translate(-540,-1110);
  stage(o,t);o.scene(t,tt);x.restore();
  footer(o);}

/* ---------------- end card: logo centred on its visible ink ---------------- */
function endCard(t,alcohol){x.fillStyle=CREAM;x.fillRect(0,0,W,H);const k=spring(t,14,.86);
  const lg=IMG.logo,ink=M.logoInk,lw=700,sc=lw/ink.w,lh=ink.h*sc;x.save();x.globalAlpha=cl(k*2);x.translate(540,720+(1-k)*40);x.drawImage(lg,ink.x,ink.y,ink.w,ink.h,-lw/2,-lh/2,lw,lh);x.restore();
  const it=[[CFG.play?'Find this offer in store.':'Find these offers in store.',900,44,600,NAVY],['210 High Road, South Benfleet',1010,40,600,NAVY],['SS7 5LD',1062,36,500,NAVY],['@cocolocal_ · cocolocal.co.uk',1290,32,600,NAVY]];
  it.forEach(([s,y,sz,wt,col],j)=>{const a=eo3((t-.12-j*.09)/.4);x.save();x.globalAlpha=a;txt(s,540,y+(1-a)*22,sz,wt,col,'center');x.restore()});
  const a=eo3((t-.5)/.4);x.save();x.globalAlpha=a;const pw=measure('PARKING ON SITE · OPEN SEVEN DAYS',24,600)+80;rrect(540-pw/2,1140,pw,58,29);x.fillStyle='#FBDC8E';x.fill();txt('PARKING ON SITE · OPEN SEVEN DAYS',540,1178,24,600,NAVY,'center',900,2);x.restore();
  txt(alcohol?'Varieties as stocked · Subject to availability · 18+ · Please drink responsibly':'Varieties as stocked · Subject to availability',540,1760,22,500,MUTED,'center',940);}

/* ---------------- scenes ---------------- */
const SCENES={
 coffee(t,tt){const o=CFG.offers.coffee,P=layout(o),L=M.liquids['coffee-action'],tf={x:520-L.w*.33,y:1075-L.h*.33,s:.66};
   const t0=tt.action*B,dur=1.75*B,p=t<t0?0:1.06*eo3((t-t0)/dur),shine=t>t0+dur?((t-t0-dur)/3.2)%1.4-.2:-1;
   x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();if(p>0){x.drawImage(liquidLayer('coffee-action',p,shine),tf.x,tf.y,L.w*tf.s,L.h*tf.s);drawDroplets('coffee-action',tf,t,t0,dur,false);}x.restore();
   plinth();P.forEach((q,j)=>{const lt=t-(tt.land+.5*j)*B;const k=cl((lt+.1)*4);contact(q.cx,q.w,k);drawProduct(q,lt,'bottle')});
   x.save();rrect(ST.x,ST.y,ST.w,ST.h,ST.r);x.clip();if(p>0)drawDroplets('coffee-action',tf,t,t0,dur,true);x.restore();},
 mccoys(t,tt){const o=CFG.offers.mccoys,P=layout(o),t0=tt.action*B,tExit=tt.exit*B;
   const C=o.crisps;C.filter(c=>c.back).forEach(c=>drawCrisp(c,t,t0,tExit));
   plinth();P.forEach((q,j)=>{const lt=t-(tt.land+.5*j)*B,kick=t>t0?.022*Math.exp(-(t-t0)*9)*Math.sin((t-t0)*40):0;contact(q.cx,q.w,cl((lt+.1)*4));drawProduct(q,lt,'bag',kick)});
   C.filter(c=>!c.back).forEach(c=>drawCrisp(c,t,t0,tExit));}
};

/* ---------------- timeline ---------------- */
const TT={copy:0,land:1,action:2,price:4,exit:13.5,end:14,total:20};
function short(id,t){const o=CFG.offers[id];o.scene=SCENES[id];const b=t/B;
  // exit: whip the whole offer out to the left while the end card slides in from the right (same move as the drinks reel)
  const kx=b<TT.exit?0:eio((b-TT.exit)/.55);
  if(kx<1){x.save();x.translate(-kx*W*1.08,0);offer(o,t,TT);x.restore();}
  if(kx>0){x.save();x.translate((1-kx)*W*1.08,0);endCard(Math.max(0,t-(TT.exit+.3)*B),o.alcohol);x.restore();}}
window.seek=t=>short(CFG.play,t);
window.DURATION=TT.total*B;
const srcs={logo:'__LOGO__'};[...Object.values(M.products).flat(),...M.crisps].forEach(p=>{if(CFG.uri[p.src])srcs[p.src]=CFG.uri[p.src]});
Object.values(M.liquids).forEach(L=>{[L.ribbon,L.umap,...L.drops.map(d=>d.src)].forEach(s=>{if(CFG.uri[s])srcs[s]=CFG.uri[s]})});
Promise.all([document.fonts.load('700 80px Poppins'),document.fonts.load('600 30px Poppins'),document.fonts.load('500 30px Poppins'),
  ...Object.entries(srcs).map(([k,s])=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{IMG[k]=i;res()};i.onerror=()=>rej(k);i.src=s}))]).then(()=>{
  Object.values(CFG.offers).forEach(o=>(o.crisps||[]).forEach(setupCrisp));makeNoise();Object.keys(M.liquids).forEach(n=>{if(IMG[M.liquids[n].umap])prepLiquid(n)});seek(0);window.READY=true;
  if(!location.search.includes('render')){let st=null;const f=n=>{st??=n;seek(((n-st)/1000)%window.DURATION);requestAnimationFrame(f)};requestAnimationFrame(f)}});
</script></body></html>
