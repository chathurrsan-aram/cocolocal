<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one narrow column of shelf strips, each strip an aisle section with its lines beneath, like walking the shelves at Booker. */
:root {
  --bg: #F2F3F5;
  --surface: #FFFFFF;
  --ink: #14161B;
  --muted: #59616F;
  --line: #DADEE5;
  --shelf: #D4561A;
  --shelf-ink: #FFFFFF;
  --tag: #F5CB2B;
  --tag-ink: #1B1600;
  --ok: #1E7A3C;
  --ok-ink: #FFFFFF;
  --ok-soft: #E2F2E7;
  --warn: #8A5800;
  --warn-soft: #FCF0D6;
  --bad: #B32318;
  --bad-soft: #FBE3E0;
  --paper: #FFFFFF;
  --paper-edge: #E4E7EC;
  --focus: #2457D6;
  --scrim: rgba(12, 14, 18, 0.55);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #1A1D23; --ink: #ECEEF2; --muted: #A1A9B7; --line: #2C313B;
    --shelf: #EC7332; --shelf-ink: #160900; --tag: #E9C330; --tag-ink: #1B1600;
    --ok: #55C682; --ok-ink: #06210F; --ok-soft: #16301F; --warn: #E6B04A; --warn-soft: #33270F;
    --bad: #F2786D; --bad-soft: #3A1B19; --paper: #F1EFEA; --paper-edge: #3A3F49;
    --focus: #8DB2FF; --scrim: rgba(0, 0, 0, 0.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #1A1D23; --ink: #ECEEF2; --muted: #A1A9B7; --line: #2C313B;
  --shelf: #EC7332; --shelf-ink: #160900; --tag: #E9C330; --tag-ink: #1B1600;
  --ok: #55C682; --ok-ink: #06210F; --ok-soft: #16301F; --warn: #E6B04A; --warn-soft: #33270F;
  --bad: #F2786D; --bad-soft: #3A1B19; --paper: #F1EFEA; --paper-edge: #3A3F49;
  --focus: #8DB2FF; --scrim: rgba(0, 0, 0, 0.7); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.eyebrow {
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); margin: 0;
}
.titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0; font-family: var(--f-display); font-stretch: 78%; font-weight: 800;
  font-size: 27px; line-height: 1.02; letter-spacing: -0.01em; text-wrap: balance;
}
.tally { text-align: right; flex-shrink: 0; }
.tally b {
  display: block; font-family: var(--f-display); font-stretch: 70%; font-weight: 800;
  font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;
}
.tally span { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--tag); border-radius: inherit; transition: width .25s ease; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 99px; padding: 7px 13px; font-size: 14.5px; font-weight: 700;
  display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 38px;
}
.filters button .ct { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button[aria-pressed="true"] .ct { color: inherit; opacity: .75; }

.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 12px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 16px;
  padding: 9px 74px 9px 38px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--ink); outline: none; }
.search input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.qclear {
  position: absolute; right: 6px; border: 0; background: var(--line); color: var(--ink);
  border-radius: 7px; padding: 6px 10px; font-size: 13.5px; font-weight: 700; cursor: pointer;
}
.hits { font-size: 13px; color: var(--muted); margin: -2px 0 0; }

/* Sections */
.list { display: grid; gap: 22px; margin-top: 18px; }
.sec { display: grid; gap: 0; }
.strip {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--shelf); color: var(--shelf-ink);
  border-radius: var(--r) var(--r) 0 0; padding: 9px 12px 9px 14px;
}
.strip h2 {
  margin: 0; font-family: var(--f-display); font-stretch: 72%; font-weight: 800;
  font-size: 19px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1;
}
.left {
  background: var(--tag); color: var(--tag-ink); font-family: var(--f-mono); font-weight: 700;
  font-size: 12.5px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.rows {
  background: var(--surface); border: 1px solid var(--line); border-top: 0;
  border-radius: 0 0 var(--r) var(--r); overflow: hidden;
}
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 12px 12px 12px 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .tap { display: contents; cursor: pointer; }
.chk {
  appearance: none; -webkit-appearance: none; margin: 2px 0 0 4px; width: 32px; height: 32px;
  border-radius: 50%; border: 2.5px solid var(--muted); background: transparent; cursor: pointer;
  display: grid; place-items: center; transition: background .15s ease, border-color .15s ease;
}
.chk::after {
  content: ""; width: 9px; height: 16px; border: solid var(--ok-ink); border-width: 0 3px 3px 0;
  transform: translateY(-2px) rotate(45deg); opacity: 0;
}
.chk:checked { background: var(--ok); border-color: var(--ok); }
.chk:checked::after { opacity: 1; }
.mark {
  margin: 4px 0 0 6px; width: 28px; height: 28px; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 50%;
}
.body { min-width: 0; display: grid; gap: 7px; }
.reading { font-weight: 700; font-size: 17.5px; line-height: 1.25; text-wrap: pretty; }
.hand {
  background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 6px;
  padding: 5px 7px; width: fit-content; max-width: 100%;
}
.hand img { display: block; height: auto; width: 100%; }
.note { font-size: 14px; color: var(--muted); line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.code { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.chip.L { background: var(--warn-soft); color: var(--warn); }
.chip.U { background: var(--bad-soft); color: var(--bad); }
.chip.X { background: var(--line); color: var(--muted); }
.when { font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; color: var(--ok); }
.when:empty { display: none; }
.see {
  margin-left: auto; border: 0; background: none; padding: 6px 2px; cursor: pointer;
  font-size: 13.5px; font-weight: 700; color: var(--shelf); text-decoration: underline; text-underline-offset: 3px;
}
.row.got .reading { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.row.got .hand { opacity: .45; }
.row.got { background: var(--ok-soft); }
.row.aside .reading { font-weight: 700; font-size: 15.5px; color: var(--muted); }
.row.crossed .reading { text-decoration: line-through; }
.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r);
  padding: 22px 16px; text-align: center; color: var(--muted); margin-top: 18px;
}
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

/* Footer */
.foot { margin-top: 30px; display: grid; gap: 18px; }
.foot h3 { margin: 0; font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 20px; }
.sheets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sheetbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px;
  cursor: pointer; display: grid; gap: 6px; text-align: left;
}
.sheetbtn img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 6px; max-width: 100%; }
.sheetbtn span { font-weight: 700; font-size: 14.5px; }
.status { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-top: 5px; flex-shrink: 0; }
.status[data-mode="synced"] .dot { background: var(--ok); }
.status[data-mode="offline"] .dot, .status[data-mode="readonly"] .dot { background: var(--warn); }
.reset {
  justify-self: start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 10px 14px; font-weight: 700; font-size: 14.5px; cursor: pointer; min-height: 44px;
}
.reset.armed { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

/* Sheet viewer */
dialog {
  border: 0; padding: 0; border-radius: 14px; background: var(--surface); color: var(--ink);
  width: min(calc(100vw - 20px), 760px); max-width: none;
  max-height: calc(100dvh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: hidden;
}
dialog[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
dialog::backdrop { background: var(--scrim); }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
.dhead b { font-size: 15.5px; min-width: 0; }
.close { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; min-height: 40px; }
.scroller { overflow: auto; -webkit-overflow-scrolling: touch; background: #2a2d33; }
.fig { position: relative; margin: 0; }
.fig img { display: block; width: 100%; height: auto; }
.hl {
  position: absolute; border: 3px solid var(--shelf); border-radius: 6px;
  box-shadow: 0 0 0 9999px rgba(10, 12, 16, 0.42);
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 10px 10px 14px;
  display: flex; gap: 12px; align-items: center; font-size: 14.5px;
  width: max-content; max-width: calc(100vw - 32px);
}
.toast button { border: 0; background: var(--tag); color: var(--tag-ink); border-radius: 6px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 380px) { h1 { font-size: 24px; } .reading { font-size: 16.5px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Coco Local · Booker run</p>
    <div class="titlerow">
      <h1>Dad’s cash and carry list</h1>
      <div class="tally" aria-live="polite"><b id="tally">0 / 0</b><span>got so far</span></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <nav class="filters" aria-label="Show">
      <button type="button" id="f-all" data-f="all" aria-pressed="true">All <span class="ct" id="c-all"></span></button>
      <button type="button" id="f-left" data-f="left" aria-pressed="false">To get <span class="ct" id="c-left"></span></button>
      <button type="button" id="f-got" data-f="got" aria-pressed="false">Got <span class="ct" id="c-got"></span></button>
      <button type="button" id="f-check" data-f="check" aria-pressed="false">Ask Dad <span class="ct" id="c-check"></span></button>
    </nav>
    <form class="search" id="searchform" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input type="search" id="q" placeholder="Search, e.g. Coke, crisps or #24" enterkeyhint="search" aria-label="Search the list" spellcheck="false">
      <button type="button" class="qclear" id="qclear" hidden>Clear</button>
    </form>
    <p class="hits" id="hits" hidden></p>
  </header>

  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden></div>

  <footer class="foot">
    <section>
      <h3>Original sheets</h3>
      <div class="sheets" style="margin-top:10px">
        <button type="button" class="sheetbtn" id="open-s1"><img id="thumb1" alt="Photo of sheet 1"><span>Sheet 1</span></button>
        <button type="button" class="sheetbtn" id="open-s2"><img id="thumb2" alt="Photo of sheet 2"><span>Sheet 2</span></button>
      </div>
    </section>
    <p class="status" id="status" data-mode="connecting"><span class="dot"></span><span id="statustext">Connecting…</span></p>
    <button type="button" class="reset" id="reset">Clear all ticks for the next trip</button>
  </footer>
</div>

<dialog id="viewer" aria-labelledby="vtitle">
  <div class="dhead"><b id="vtitle">Sheet</b><button type="button" class="close" id="vclose">Close</button></div>
  <div class="scroller" id="vscroll"><figure class="fig"><img id="vimg" alt=""><div class="hl" id="vhl" hidden></div></figure></div>
</dialog>
<div class="toast" id="toast" hidden role="status"><span id="toasttext"></span><button type="button" id="undo">Undo</button></div>

function whenText(ms) {
  const d = new Date(ms), t = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + " " + t;
}
function confLabel(c) { return c === "L" ? "Likely" : c === "U" ? "Unsure" : ""; }

function build() {
  const list = $("list");
  let cur = null;
  for (const it of ITEMS) {
    if (!cur || cur.name !== it.sec) {
      const sec = document.createElement("section");
      sec.className = "sec";
      const strip = document.createElement("div");
      strip.className = "strip";
      const h2 = document.createElement("h2");
      h2.textContent = it.sec;
      const left = document.createElement("span");
      left.className = "left";
      strip.append(h2, left);
      const rows = document.createElement("div");
      rows.className = "rows";
      sec.append(strip, rows);
      list.append(sec);
      cur = { name: it.sec, el: sec, rows, left, items: [] };
      secs.push(cur);
    }
    cur.items.push(it);
    cur.rows.append(makeRow(it));
  }
}

function makeRow(it) {
  const row = document.createElement("div");
  row.className = "row" + (it.k !== "item" ? " aside" : "") + (it.k === "crossed" ? " crossed" : "");
  const body = document.createElement("div");
  body.className = "body";

  const reading = document.createElement("div");
  reading.className = "reading";
  reading.textContent = it.r;

  const hand = document.createElement("div");
  hand.className = "hand";
  hand.style.width = Math.round(it.w * 0.62 + 16) + "px";
  const img = document.createElement("img");
  img.src = it.img;
  img.alt = "Handwriting for line " + it.n;
  img.width = it.w; img.height = it.h;
  img.decoding = "async";
  hand.append(img);

  const meta = document.createElement("div");
  meta.className = "meta";
  const code = document.createElement("span");
  code.className = "code";
  code.textContent = "#" + String(it.n).padStart(2, "0") + " · SHEET " + it.s;
  meta.append(code);
  let when = null;
  if (it.k === "item") { when = document.createElement("span"); when.className = "when"; meta.append(when); }
  if (it.k === "heading" || it.k === "note" || it.k === "crossed") {
    const x = document.createElement("span");
    x.className = "chip X";
    x.textContent = it.k === "heading" ? "Heading" : it.k === "crossed" ? "Crossed out" : "Not an item";
    meta.append(x);
  } else if (it.c !== "C") {
    const ch = document.createElement("span");
    ch.className = "chip " + it.c;
    ch.textContent = confLabel(it.c);
    meta.append(ch);
  }
  const see = document.createElement("button");
  see.type = "button";
  see.className = "see";
  see.textContent = "See on sheet";
  see.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); openSheet(it.s, it); });
  meta.append(see);

  body.append(reading, hand);
  if (it.note) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = it.note;
    body.append(note);
  }
  body.append(meta);

  if (it.k === "item") {
    const label = document.createElement("label");
    label.className = "tap";
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.className = "chk";
    chk.id = "chk-" + it.id;
    chk.setAttribute("aria-label", it.r);
    chk.addEventListener("change", () => setGot(it, chk.checked, true));
    label.append(chk, body);
    row.append(label);
    rowsById[it.id] = { row, chk, it, when };
  } else {
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = it.k === "crossed" ? "×" : "–";
    row.append(mark, body);
  }
  row.dataset.id = it.id;
  row.dataset.k = it.k;
  return row;
}

let query = [];
function fold(t) { return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9#£.\s]/g, " "); }
for (const it of ITEMS) it.hay = fold([it.r, it.note, it.sec, "#" + it.n, "#" + String(it.n).padStart(2, "0"), "sheet " + it.s].join(" "));
function matches(it) { return query.every(w => it.hay.includes(w)); }
function visible(it) {
  if (query.length && !matches(it)) return false;
  if (filter === "all") return true;
  if (it.k !== "item") return false;
  if (filter === "left") return !got[it.id];
  if (filter === "got") return !!got[it.id];
  if (filter === "check") return it.c === "U";
  return true;
}

function render() {
  const n = shop.length;
  const g = shop.filter(i => got[i.id]).length;
  $("tally").textContent = g + " / " + n;
  $("barfill").style.width = (n ? (g / n) * 100 : 0) + "%";
  $("c-all").textContent = ITEMS.length;
  $("c-left").textContent = n - g;
  $("c-got").textContent = g;
  $("c-check").textContent = shop.filter(i => i.c === "U").length;
  for (const b of document.querySelectorAll(".filters button")) b.setAttribute("aria-pressed", String(b.dataset.f === filter));

  for (const id in rowsById) {
    const r = rowsById[id];
    const on = !!got[id];
    r.chk.checked = on;
    r.row.classList.toggle("got", on);
    if (r.when) r.when.textContent = on && typeof got[id] === "number" ? "Got " + whenText(got[id]) : "";
  }
  let shown = 0;
  for (const s of secs) {
    let any = 0;
    for (const it of s.items) {
      const el = s.rows.querySelector('[data-id="' + it.id + '"]');
      const v = visible(it);
      el.hidden = !v;
      if (v) any++;
    }
    const leftCount = s.items.filter(i => i.k === "item" && !got[i.id]).length;
    s.left.textContent = leftCount === 0 ? "All got" : leftCount + " left";
    s.el.hidden = any === 0;
    shown += any;
  }
  const hits = $("hits");
  if (query.length) {
    hits.hidden = false;
    hits.textContent = shown === 0 ? "No matches" : shown === 1 ? "1 match" : shown + " matches";
  } else hits.hidden = true;
  const empty = $("empty");
  if (shown === 0) {
    empty.hidden = false;
    empty.innerHTML = "";
    const b = document.createElement("b");
    const p = document.createElement("span");
    if (query.length) { b.textContent = "Nothing matches \u201c" + $("q").value.trim() + "\u201d"; p.textContent = filter === "all" ? "Try a shorter word, or check the spelling." : "Try a shorter word, or switch to All."; }
    else if (filter === "left") { b.textContent = "Everything is ticked off"; p.textContent = "Nothing left to get on Dad’s list."; }
    else if (filter === "got") { b.textContent = "Nothing ticked yet"; p.textContent = "Tap the circle next to an item once it is in the trolley."; }
    else { b.textContent = "Nothing to show"; p.textContent = "Try another filter."; }
    empty.append(b, p);
  } else empty.hidden = true;
}

/* Toast with undo */
let toastTimer = null, lastUndo = null;
function toast(text, undo) {
  $("toasttext").textContent = text;
  lastUndo = undo;
  $("undo").hidden = !undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; lastUndo = null; }, 4000);
}
$("undo").addEventListener("click", () => { const u = lastUndo; $("toast").hidden = true; lastUndo = null; if (u) u(); });

function setGot(it, on, user) {
  if (on) got[it.id] = got[it.id] || Date.now(); else delete got[it.id];
  saveLocal();
  queueWrite(it.id, on);
  render();
  if (user && filter !== "all") toast((on ? "Ticked " : "Unticked ") + it.r, () => setGot(it, !on, false));
}

/* Search */
$("q").addEventListener("input", () => {
  query = fold($("q").value).split(/\s+/).filter(Boolean);
  $("qclear").hidden = !$("q").value;
  render();
});
$("qclear").addEventListener("click", () => { $("q").value = ""; query = []; $("qclear").hidden = true; render(); $("q").focus(); });
$("searchform").addEventListener("submit", e => { e.preventDefault(); $("q").blur(); });

/* Filters */
for (const b of document.querySelectorAll(".filters button")) {
  b.addEventListener("click", () => {
    filter = b.dataset.f;
    try { localStorage.setItem(FKEY, filter); } catch (e) {}
    render();
    window.scrollTo({ top: 0 });
  });
}

/* Sheet viewer */
const viewer = $("viewer");
function openSheet(s, it) {
  $("vimg").src = SHEETS[String(s)];
  $("vimg").alt = "Photo of sheet " + s;
  $("vtitle").textContent = it ? "Sheet " + s + ", line #" + String(it.n).padStart(2, "0") + ": " + it.r : "Sheet " + s;
  const hl = $("vhl");
  if (it) {
    const [x, y, w, h] = it.bx;
    hl.style.left = x + "%"; hl.style.top = y + "%"; hl.style.width = w + "%"; hl.style.height = h + "%";
    hl.hidden = false;
  } else hl.hidden = true;
  try { viewer.showModal(); } catch (e) { viewer.setAttribute("open", ""); }
  const go = () => {
    const sc = $("vscroll");
    if (it) {
      const img = $("vimg");
      const top = img.offsetHeight * it.bx[1] / 100 + img.offsetHeight * it.bx[3] / 200 - sc.clientHeight / 2;
      sc.scrollTop = Math.max(0, top);
    } else sc.scrollTop = 0;
  };
  if ($("vimg").complete) requestAnimationFrame(go); else $("vimg").onload = go;
}
$("vclose").addEventListener("click", () => viewer.close());
viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });
$("open-s1").addEventListener("click", () => openSheet(1, null));
$("open-s2").addEventListener("click", () => openSheet(2, null));
$("thumb1").src = SHEETS["1"];
$("thumb2").src = SHEETS["2"];

/* Reset with an in-page confirmation */
let armTimer = null;
$("reset").addEventListener("click", () => {
  const b = $("reset");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed");
    b.textContent = "Tap again to clear every tick";
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Clear all ticks for the next trip"; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  b.classList.remove("armed");
  b.textContent = "Clear all ticks for the next trip";
  const before = Object.assign({}, got);
  got = {};
  saveLocal();
  queueReset();
  render();
  toast("All ticks cleared", () => { got = before; saveLocal(); queueReset(before); render(); });
});

/* Live sync: every phone with this page open shares one tick list on the shop's server. */
const API = "/api/list";
let live = false, queue = [], sending = false, pollTimer = null, retryTimer = null, failures = 0, remote = {};
function setMode(mode) {
  const s = $("status");
  s.dataset.mode = mode;
  const t = {
    connecting: "Connecting…",
    synced: "Live. Anyone with this page open sees ticks within a few seconds, so you won’t buy the same thing twice.",
    local: "The shared list isn’t available right now, so ticks save on this phone only.",
    offline: "No signal right now. Ticks are kept on this phone and will share when you are back online.",
  }[mode];
  $("statustext").textContent = t;
}
function applyOp(state, op) {
  if (op.action === "tick") { if (op.got) state[op.id] = state[op.id] || Date.now(); else delete state[op.id]; }
  else if (op.action === "reset") { for (const k in state) delete state[k]; }
  else if (op.action === "restore") { for (const k in state) delete state[k]; Object.assign(state, op.ticks); }
}
function refresh() {
  const state = Object.assign({}, remote);
  for (const op of queue) applyOp(state, op);
  got = state;
  saveLocal();
  render();
}
async function api(method, body) {
  const res = await fetch(API, {
    method, cache: "no-store",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
  return res.json();
}
function noServer(e) { return e && (e.status === 503 || e.status === 404); }
async function poll() {
  try {
    const d = await api("GET");
    remote = d.ticks || {};
    live = true; failures = 0;
    setMode("synced");
    refresh();
    if (queue.length) flush();
  } catch (e) {
    if (noServer(e)) { live = false; queue = []; setMode("local"); clearInterval(pollTimer); }
    else setMode("offline");
  }
}
function send(op) {
  if (!live && $("status").dataset.mode !== "offline") return;
  queue.push(op);
  flush();
}
async function flush() {
  if (sending || !queue.length) return;
  sending = true;
  while (queue.length) {
    try {
      const d = await api("POST", queue[0]);
      queue.shift();
      remote = d.ticks || remote;
      failures = 0;
      if ($("status").dataset.mode !== "synced") setMode("synced");
    } catch (e) {
      if (e.status === 400) { queue.shift(); continue; }
      if (noServer(e)) { live = false; queue = []; setMode("local"); break; }
      setMode("offline");
      failures++;
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flush, Math.min(15000, 1500 * failures) + Math.random() * 800);
      break;
    }
  }
  sending = false;
  refresh();
}
function queueWrite(id, on) { send({ action: "tick", id, got: on }); }
function queueReset(state) { send(state ? { action: "restore", ticks: state } : { action: "reset" }); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && live) { flush(); poll(); } });
window.addEventListener("online", () => { flush(); poll(); });
async function connect() {
  await poll();
  if ($("status").dataset.mode !== "local") {
    pollTimer = setInterval(() => { if (document.visibilityState === "visible") poll(); }, 4000);
  }
}

build();
render();
setMode("connecting");
connect();
</script>
</body>
